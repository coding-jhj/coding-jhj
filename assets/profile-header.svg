<svg width="1200" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AI systems and post-training research header</title>
  <desc id="desc">Abstract dark research engineering banner with evaluation, grounding, and deployment accents.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1200" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1220" />
      <stop offset="1" stop-color="#162B4D" />
    </linearGradient>
    <linearGradient id="blue" x1="720" y1="0" x2="1160" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D4ED8" />
      <stop offset="1" stop-color="#38BDF8" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#93C5FD" stroke-opacity="0.10" />
    </pattern>
  </defs>

  <rect width="1200" height="220" rx="24" fill="url(#paper)" />
  <rect x="690" y="0" width="510" height="220" fill="url(#grid)" />
  <path d="M770 0H1200V220H890C890 220 956 164 910 105C868 51 770 0 770 0Z" fill="url(#blue)" opacity="0.92" />
  <circle cx="1050" cy="42" r="74" fill="#F97316" opacity="0.9" />
  <circle cx="1120" cy="174" r="40" fill="#FBBF24" opacity="0.92" />
  <path d="M748 183C824 152 852 103 906 73C958 44 1022 35 1100 40" stroke="#A7F3D0" stroke-width="3" stroke-linecap="round" opacity="0.86" />
  <path d="M746 198C826 170 860 128 916 98C976 66 1034 63 1120 72" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <circle cx="818" cy="156" r="5" fill="#FFFFFF" />
  <circle cx="916" cy="98" r="5" fill="#FFFFFF" />
  <circle cx="1034" cy="63" r="5" fill="#FFFFFF" />

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="72" y="60" fill="#93C5FD" font-size="13" font-weight="700" letter-spacing="4">AI SYSTEMS / RESEARCH ENGINEERING</text>
    <text x="72" y="119" fill="#F8FAFC" font-size="46" font-weight="800" letter-spacing="1">POST-TRAINING</text>
    <text x="74" y="157" fill="#BFDBFE" font-size="17" font-weight="700" letter-spacing="3">EVALUATION  /  GROUNDING  /  DEPLOYMENT</text>
