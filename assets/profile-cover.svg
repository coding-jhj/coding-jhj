<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Jeong Hwan Ju post-training research engineering portfolio</title>
  <desc id="desc">A dark neon editorial cover for an AI systems and research engineering portfolio.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B14" />
      <stop offset="0.52" stop-color="#11102A" />
      <stop offset="1" stop-color="#071B29" />
    </linearGradient>
    <linearGradient id="beam" x1="710" y1="35" x2="1160" y2="250" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" />
      <stop offset="0.5" stop-color="#F43F5E" />
      <stop offset="1" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="title" x1="62" y1="110" x2="650" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" />
      <stop offset="0.52" stop-color="#F0ABFC" />
      <stop offset="1" stop-color="#FB7185" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#CBD5E1" stroke-opacity="0.07" />
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="22" fill="url(#background)" />
  <rect width="1200" height="280" rx="22" fill="url(#grid)" />
  <path d="M690 280C760 208 777 86 927 26C1004 -5 1080 18 1200 0V280H690Z" fill="#111C39" fill-opacity="0.78" />
  <path d="M700 280C790 195 812 91 944 42C1038 7 1110 41 1200 24" stroke="url(#beam)" stroke-width="2" filter="url(#glow)" />
  <path d="M761 280C832 215 854 126 963 84C1054 49 1121 68 1200 56" stroke="#22D3EE" stroke-opacity="0.42" />
  <circle cx="1004" cy="92" r="4" fill="#F8FAFC" filter="url(#glow)" />
  <circle cx="1114" cy="54" r="3" fill="#F8FAFC" filter="url(#glow)" />
  <circle cx="846" cy="183" r="3" fill="#F43F5E" filter="url(#glow)" />
  <path d="M50 236H624" stroke="#334155" />
  <path d="M50 236H254" stroke="url(#beam)" stroke-width="3" />

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="52" y="48" fill="#A5B4FC" font-size="12" font-weight="700" letter-spacing="3.8">CODING-JHJ / AI ENGINEERING</text>
    <text x="52" y="128" fill="#F8FAFC" font-size="66" font-weight="900" letter-spacing="-2.8">JEONG HWAN JU</text>
    <text x="52" y="177" fill="url(#title)" font-size="31" font-weight="900" letter-spacing="1.2">POST-TRAINING RESEARCH ENGINEER</text>
    <text x="52" y="217" fill="#CBD5E1" font-size="14" font-weight="700" letter-spacing="3.4">EVALUATION  /  GROUNDING  /  DEPLOYMENT</text>
    <text x="1084" y="242" fill="#A5F3FC" font-size="12" font-weight="800" letter-spacing="2.8" transform="rotate(-90 1084 242)">SELECTED WORK</text>
    <text x="1128" y="242" fill="#FDA4AF" font-size="12" font-weight="800" letter-spacing="2.8" transform="rotate(-90 1128 242)">RESEARCH DIRECTION</text>
  </g>
</svg>
