<svg width="1200" height="150" viewBox="0 0 1200 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Selected work index</title>
  <desc id="desc">Three neon portfolio cards in order: Lease-Companion, VoiceGuide, and Rainbow Bridge.</desc>

  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1200" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020" />
      <stop offset="0.52" stop-color="#11102A" />
      <stop offset="1" stop-color="#0B1F2A" />
    </linearGradient>
    <linearGradient id="violet" x1="24" y1="20" x2="374" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" />
      <stop offset="1" stop-color="#C084FC" />
    </linearGradient>
    <linearGradient id="coral" x1="424" y1="20" x2="774" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F43F5E" />
      <stop offset="1" stop-color="#FB7185" />
    </linearGradient>
    <linearGradient id="cyan" x1="824" y1="20" x2="1174" y2="130" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0891B2" />
      <stop offset="1" stop-color="#22D3EE" />
    </linearGradient>
  </defs>

  <rect width="1200" height="150" rx="18" fill="url(#base)" />
  <rect x="12" y="12" width="376" height="126" rx="14" fill="#17112A" stroke="url(#violet)" stroke-opacity="0.9" />
  <rect x="412" y="12" width="376" height="126" rx="14" fill="#24121C" stroke="url(#coral)" stroke-opacity="0.9" />
  <rect x="812" y="12" width="376" height="126" rx="14" fill="#0C2430" stroke="url(#cyan)" stroke-opacity="0.9" />

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="34" y="43" fill="#C084FC" font-size="11" font-weight="800" letter-spacing="2.8">RECOGNITION</text>
    <text x="34" y="82" fill="#F8FAFC" font-size="23" font-weight="900">LEASE-COMPANION</text>
    <text x="34" y="110" fill="#DDD6FE" font-size="12" font-weight="700" letter-spacing="1.8">TEAM LEAD · AI/LLM</text>

    <text x="434" y="43" fill="#FB7185" font-size="11" font-weight="800" letter-spacing="2.8">ON-DEVICE AI</text>
    <text x="434" y="82" fill="#F8FAFC" font-size="23" font-weight="900">VOICEGUIDE</text>
    <text x="434" y="110" fill="#FECDD3" font-size="12" font-weight="700" letter-spacing="1.8">ACCESSIBILITY · PRIVACY</text>

    <text x="834" y="43" fill="#22D3EE" font-size="11" font-weight="800" letter-spacing="2.8">AI INFRASTRUCTURE</text>
    <text x="834" y="82" fill="#F8FAFC" font-size="23" font-weight="900">RAINBOW BRIDGE</text>
    <text x="834" y="110" fill="#A5F3FC" font-size="12" font-weight="700" letter-spacing="1.8">CONTRIBUTION BRANCH</text>
  </g>
</svg>
